name: Deploy

# The real execution path behind the "Deploy to Cloudflare" button. The button
# creates the repo and the bindings it can; this workflow creates the ones it
# cannot (queues, datasets) and only then deploys — so the first deploy produces
# a working system rather than a Worker that fails on its first send.
# Manual by default. A repo created by the Deploy button has the Cloudflare
# secrets; a fork or a clone does not, and a workflow that fails on every push
# for a missing token teaches people to ignore the red X. `deploy-on-push`
# turns the automatic path on once the secrets are actually set.
on:
  workflow_dispatch:
  push:
    branches: [deploy-on-push]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then run this workflow again."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Provision the resources the button does not create
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec tsx scripts/provision.ts

      # The root script, not the app's: it also runs `emit-root-wrangler.mjs`
      # and `ensure-resources.mjs`, which are what create the queues and
      # namespaces and what re-scope them for an instance deployed under
      # another name. Building only `@mailysend/app` deployed a Worker whose
      # bindings pointed at resources this account may not have.
      - name: Build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run build:cf

      # The app applies its own migrations at boot, so this step is a warm-up
      # rather than a prerequisite: it keeps the ~230 statements of a first
      # migration off the first real request. The database name is read from
      # the config the build just emitted — hardcoding `mailysend` here applied
      # the migrations to the wrong database, or to none, on every instance
      # deployed under a different name.
      - name: Apply database migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          db=$(node -e "const c=require('./apps/app/.output-cf/server/wrangler.json');process.stdout.write(c.d1_databases?.[0]?.database_name ?? '')")
          if [ -z "$db" ]; then
            echo "::error::The build emitted no D1 binding, so there is no database to migrate."
            exit 1
          fi
          echo "Applying migrations to $db"
          pnpm exec wrangler d1 migrations apply "$db" --remote --config apps/app/wrangler.jsonc

      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # The Cloudflare Vite plugin writes the deployable config next to the
        # build output, with the asset directory already resolved. Deploying
        # from `apps/app/wrangler.jsonc` would upload the source entry instead.
        run: pnpm exec wrangler deploy --config apps/app/.output-cf/server/wrangler.json
